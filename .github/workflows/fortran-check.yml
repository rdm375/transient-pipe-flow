name: Fortran regression tests

on:
  push:
    branches:
      - main
      - 'development/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Fortran and Make
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Run numerical regression suite
        run: make check
